services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gitdevpilot-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5433:5432"
    volumes:
      - gitdevpilot_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d gitdevpilot"]
      interval: 5s
      timeout: 5s
      retries: 5
  
volumes:
  gitdevpilot_pg_data: